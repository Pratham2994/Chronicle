[project]
name = "chronicle-backend"
version = "2.0.0"
description = "Reads a Spotify extended streaming history with DuckDB and serves the numbers."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.3",
    "fastapi>=0.136.3",
    "pandas>=3.0.3",
    "python-multipart>=0.0.20",
    "requests>=2.32.0",
    "scikit-learn>=1.9.0",
    "uvicorn>=0.49.0",
]
